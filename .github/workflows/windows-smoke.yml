# Exploratory: does Crewly install and start natively on Windows (no WSL)?
# Every step keeps going after a failure so one run lists all blockers.
name: Windows native smoke

on:
  push:
    branches: [windows-native-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  from-source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        shell: pwsh
        run: |
          npm ci 2>&1 | Select-Object -Last 25
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: frontend npm ci
        shell: pwsh
        run: |
          cd frontend
          npm ci 2>&1 | Select-Object -Last 10
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: build
        shell: pwsh
        run: |
          npm run build 2>&1 | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: crewly start, wait for health
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\crewly-start.log"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c node dist\cli\cli\src\index.js start --no-browser > `"$log`" 2>&1" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 48; $i++) {
            Start-Sleep -Seconds 5
            try { $r = Invoke-WebRequest -Uri http://localhost:8787/api/health -UseBasicParsing -TimeoutSec 4; "health: $($r.StatusCode) after $(($i+1)*5)s"; $r.Content.Substring(0, [Math]::Min(300, $r.Content.Length)); $ok = $true; break } catch { }
          }
          if (-not $ok) { "health: no answer in 240 s" }
          Start-Sleep -Seconds 45
          "--- start log: errors and warnings ---"
          Get-Content $log -ErrorAction SilentlyContinue | Select-String -Pattern 'ERROR|WARN|not recognized|ENOENT|EPERM|EINVAL|Failed|Unhandled|unknown option' | Select-Object -First 80 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) }
          "--- start log: last 40 lines ---"
          Get-Content $log -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { $_.Substring(0, [Math]::Min(300, $_.Length)) }
          if (-not $ok) { exit 1 }
      - name: API after start
        continue-on-error: true
        shell: bash
        run: |
          T="$(cat "$USERPROFILE/.crewly/api-token" 2>/dev/null || true)"
          for p in /api/teams /api/projects /api/system/status /api/cloud/status; do
            printf '%s -> ' "$p"; curl -s -m 10 -o /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $T" "http://localhost:8787$p"
          done
          ls "$USERPROFILE/.crewly" | head -30
      - name: unit tests (session, system, cli, utils)
        continue-on-error: true
        shell: pwsh
        run: |
          npx jest backend/src/services/session backend/src/services/system backend/src/utils cli/src --maxWorkers=2 2>&1 | Select-String -Pattern '^(FAIL|Tests:|Test Suites:)' | Select-Object -First 120
