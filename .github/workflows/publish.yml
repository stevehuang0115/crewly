# Publish crewly to npm on a version tag, with no npm token.
#
# Auth is npm Trusted Publishing: npmjs.com is told to trust this exact
# workflow file in this repository, GitHub mints a short-lived OIDC token for
# the run, and npm accepts it in place of a login — no 2FA prompt, no stored
# secret, and a provenance attestation is attached automatically.
#
# Release recipe:
#   npm version X.Y.Z --no-git-tag-version
#   git commit -am "chore(release): crewly X.Y.Z"
#   git tag vX.Y.Z && git push origin main vX.Y.Z
#
# The tag must match package.json exactly; a mismatch stops the run before
# anything is built so a stray tag cannot publish the wrong version.
name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write   # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest && npm --version

      - name: Tag must match package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Workspaces (frontend, packages/*) install with the root lockfile.
      # node-pty and better-sqlite3 compile in postinstall; ubuntu-latest has
      # the toolchain.
      - run: npm ci

      # prepublishOnly runs the full build (backend + frontend + cli).
      - run: npm publish --access public
