id: weekly-content-cycle
name: Weekly Content Cycle
description: End-to-end weekly marketing workflow from strategy planning to content creation and performance reporting.
version: "1.0.0"

steps:
  - id: plan-content-calendar
    order: 1
    name: Content Strategy & Calendar
    owner: "Marketing Strategist (Maya)"
    description: Research trends, review last week's performance, and create the weekly content calendar with 5-7 posts across platforms.
    outputs:
      - name: weekly-calendar
        description: Content calendar with post topics, platforms, types, and scheduled dates
        format: markdown
    qualityGate: strategy-quality

  - id: create-content
    order: 2
    name: Content Creation
    owner: "Content Writer (Alex)"
    description: Write all content pieces from the weekly calendar. Follow platform-specific guidelines and brand voice.
    dependsOn: [plan-content-calendar]
    inputs:
      - name: weekly-calendar
        format: markdown
        required: true
    outputs:
      - name: content-drafts
        description: Complete content pieces ready for review
        format: markdown
    qualityGate: content-quality

  - id: weekly-report
    order: 3
    name: Weekly Performance Report
    owner: "Marketing Analyst (Jordan)"
    description: Compile platform metrics, identify top performers, and provide data-driven optimization recommendations.
    dependsOn: [create-content]
    inputs:
      - name: content-drafts
        format: markdown
        required: false
    outputs:
      - name: performance-report
        description: Structured weekly performance report with metrics and recommendations
        format: markdown
    qualityGate: report-quality
