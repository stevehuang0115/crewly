<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #f8f9fb;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo { width: 20px; height: 20px; border-radius: 4px; background: #6c5ce7; }

    /* Status indicator */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-bar.disconnected { background: #fde8e8; color: #c0392b; }
    .status-bar.disconnected .status-dot { background: #e74c3c; }
    .status-bar.connecting { background: #fef3cd; color: #856404; }
    .status-bar.connecting .status-dot { background: #f39c12; animation: pulse 1s infinite; }
    .status-bar.connected { background: #d4edda; color: #155724; }
    .status-bar.connected .status-dot { background: #27ae60; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Form */
    label { display: block; font-weight: 500; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #6c5ce7; }

    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btnConnect { background: #6c5ce7; color: #fff; }
    #btnConnect:hover { background: #5b4bd5; }
    #btnConnect:disabled { background: #b8b0e8; cursor: default; }
    #btnDisconnect { background: #e9ecef; color: #495057; }
    #btnDisconnect:hover { background: #dee2e6; }
    #btnDisconnect:disabled { opacity: 0.4; cursor: default; }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1><div class="logo"></div> Crewly Remote</h1>

  <div id="statusBar" class="status-bar disconnected">
    <div class="status-dot"></div>
    <span id="statusText">Disconnected</span>
  </div>

  <label for="serverUrl">WebSocket Server URL</label>
  <input type="text" id="serverUrl" placeholder="ws://localhost:8787/ws/browser" />

  <div class="btn-row">
    <button id="btnConnect">Connect</button>
    <button id="btnDisconnect" disabled>Disconnect</button>
  </div>

  <div class="footer">Crewly Remote Browser v0.1.0</div>

  <script src="popup.js"></script>
</body>
</html>
