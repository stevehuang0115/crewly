<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 36px; fill: #F0F6FC; }
      .tagline { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 22px; fill: #C9D1D9; }
      .feature-chip { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 14px; fill: #C9D1D9; }
      .cta { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #8B949E; }
      .url { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #6B7280; }
      .dash-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #8B949E; }
      .dash-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #C9D1D9; }
      .dash-green { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #22C55E; }
      .agent-name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #F0F6FC; }
      .dot-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8B949E; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117" />
      <stop offset="50%" style="stop-color:#111827" />
      <stop offset="100%" style="stop-color:#161B22" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="0.5" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3" />

  <!-- Logo -->
  <text x="80" y="75" class="logo">Crewly</text>

  <!-- Tagline -->
  <text x="80" y="120" class="tagline">The Secure OS for AI Agent Teams</text>

  <!-- Dashboard mockup (center) -->
  <rect x="80" y="155" width="750" height="380" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1" filter="url(#shadow)" />

  <!-- Dashboard title bar -->
  <rect x="80" y="155" width="750" height="30" rx="8" fill="#21262D" />
  <rect x="80" y="175" width="750" height="10" fill="#21262D" />
  <circle cx="100" cy="170" r="5" fill="#EF4444" opacity="0.7" />
  <circle cx="116" cy="170" r="5" fill="#EAB308" opacity="0.7" />
  <circle cx="132" cy="170" r="5" fill="#22C55E" opacity="0.7" />
  <text x="460" y="174" text-anchor="middle" class="dash-title">Crewly Dashboard</text>
  <!-- CloudBar indicator -->
  <rect x="720" y="162" width="90" height="16" rx="8" fill="#14532D" />
  <circle cx="735" cy="170" r="3" fill="#22C55E" />
  <text x="745" y="174" class="dot-label" fill="#22C55E" font-size="9">Connected</text>

  <!-- Sidebar -->
  <rect x="80" y="185" width="110" height="350" fill="#0D1117" />
  <text x="100" y="210" class="dash-title" fill="#3B82F6">Dashboard</text>
  <text x="100" y="230" class="dash-title">Chat</text>
  <text x="100" y="250" class="dash-title">Teams</text>
  <text x="100" y="270" class="dash-title">Projects</text>
  <text x="100" y="290" class="dash-title">Marketplace</text>

  <!-- Team name -->
  <text x="210" y="210" class="agent-name" font-size="13" fill="#C9D1D9">TEAM: Crewly Product</text>

  <!-- Agent cards -->
  <!-- Sam -->
  <rect x="210" y="225" width="170" height="65" rx="6" fill="#0D1117" stroke="#3B82F6" stroke-width="1" />
  <circle cx="232" cy="245" r="8" fill="#1E3A5F" />
  <text x="232" y="249" text-anchor="middle" font-size="9" fill="#3B82F6">S</text>
  <text x="248" y="248" class="agent-name">Sam (TL)</text>
  <circle cx="325" cy="244" r="4" fill="#22C55E" />
  <text x="337" y="248" class="dot-label" fill="#22C55E">Active</text>
  <text x="228" y="275" class="dot-label">coding: jwt-auth</text>

  <!-- Leo -->
  <rect x="395" y="225" width="170" height="65" rx="6" fill="#0D1117" stroke="#8B5CF6" stroke-width="1" />
  <circle cx="417" cy="245" r="8" fill="#3B1E5F" />
  <text x="417" y="249" text-anchor="middle" font-size="9" fill="#8B5CF6">L</text>
  <text x="433" y="248" class="agent-name">Leo (Dev)</text>
  <circle cx="510" cy="244" r="4" fill="#22C55E" />
  <text x="522" y="248" class="dot-label" fill="#22C55E">Active</text>
  <text x="413" y="275" class="dot-label">testing: api-routes</text>

  <!-- Ava -->
  <rect x="580" y="225" width="170" height="65" rx="6" fill="#0D1117" stroke="#EC4899" stroke-width="1" />
  <circle cx="602" cy="245" r="8" fill="#5F1E3B" />
  <text x="602" y="249" text-anchor="middle" font-size="9" fill="#EC4899">A</text>
  <text x="618" y="248" class="agent-name">Ava (UX)</text>
  <circle cx="695" cy="244" r="4" fill="#22C55E" />
  <text x="707" y="248" class="dot-label" fill="#22C55E">Active</text>
  <text x="598" y="275" class="dot-label">design: login-ui</text>

  <!-- Terminal panel -->
  <rect x="210" y="305" width="600" height="210" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1" />
  <rect x="210" y="305" width="600" height="22" fill="#161B22" rx="6" />
  <rect x="210" y="320" width="600" height="7" fill="#161B22" />
  <text x="225" y="320" class="dash-title" fill="#3B82F6">TERMINAL: Sam (Tech Lead)</text>
  <text x="228" y="348" class="dash-green">$</text>
  <text x="240" y="348" class="dash-text"> npm run test</text>
  <text x="228" y="365" class="dash-text">PASS  src/auth/jwt.test.ts (23 tests)</text>
  <text x="228" y="382" class="dash-text">PASS  src/auth/middleware.test.ts (18 tests)</text>
  <text x="228" y="399" class="dash-text">PASS  src/auth/session.test.ts (12 tests)</text>
  <text x="228" y="416" class="dash-green">Test Suites: 3 passed, 3 total</text>
  <text x="228" y="433" class="dash-green">Tests:       53 passed, 53 total</text>
  <text x="228" y="455" class="dash-green">$</text>
  <text x="240" y="455" class="dash-text"> git commit -m "feat: add JWT auth middleware"</text>
  <text x="228" y="475" class="dash-green">CREWLY QUALITY GATE: &#x2714; ALL CHECKS PASSED</text>
  <text x="228" y="492" class="dash-text">[main a3f8b2c] feat: add JWT auth middleware</text>

  <!-- Right side: Feature chips -->
  <rect x="870" y="155" width="280" height="110" rx="8" fill="#161B22" stroke="#22C55E" stroke-width="1" />
  <circle cx="895" cy="185" r="6" fill="#22C55E" />
  <text x="910" y="189" class="feature-chip">PTY Isolation</text>
  <text x="910" y="207" class="url">Every agent sandboxed</text>

  <rect x="870" y="280" width="280" height="110" rx="8" fill="#161B22" stroke="#3B82F6" stroke-width="1" />
  <circle cx="895" cy="310" r="6" fill="#3B82F6" />
  <text x="910" y="314" class="feature-chip">Local-First</text>
  <text x="910" y="332" class="url">Data never leaves your machine</text>

  <rect x="870" y="405" width="280" height="110" rx="8" fill="#161B22" stroke="#8B5CF6" stroke-width="1" />
  <circle cx="895" cy="435" r="6" fill="#8B5CF6" />
  <text x="910" y="439" class="feature-chip">Multi-Runtime</text>
  <text x="910" y="457" class="url">Claude + Gemini + Codex</text>

  <!-- CTA -->
  <text x="80" y="575" class="cta">$ npx crewly init</text>
  <text x="870" y="575" class="url" text-anchor="start">github.com/crewly-ai/crewly</text>
</svg>